# A v* tag builds and signs the release (tools/release.sh) and publishes it as a GitHub release. The dictionary app
# gets its own release, dict-<version>, the first time its version is seen; roma downloads it from there. The app and
# the dictionary build in parallel jobs, and the core tests (which need the slim dictionary) in a third; roma's release
# is published only once its dictionary release exists and the tests pass.
# Secrets: KEYSTORE_BASE64 (the .jks, base64), STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
# ubuntu-24.04, not ubuntu-latest: the image the release is built and tested on, changed on purpose rather than by GitHub.
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK and pigz
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          sudo apt-get install -y pigz > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: tools/release.sh app
      - uses: actions/upload-artifact@v7
        with: { name: app, path: dist/roma-*.apk }

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - run: tools/release.sh test

  # Built only when its version has no release yet; otherwise this job ends after one API call.
  dict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dictionary already released?
        id: check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(sed -n 's/^val dictRelease = "\(.*\)"/\1/p' core/build.gradle.kts)
          echo "tag=dict-$v" >> "$GITHUB_OUTPUT"
          if gh release view "dict-$v" > /dev/null 2>&1; then echo "build=" >> "$GITHUB_OUTPUT"; else echo "build=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.build
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - if: steps.check.outputs.build
        uses: gradle/actions/setup-gradle@v5
      - name: Android SDK and pigz
        if: steps.check.outputs.build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          sudo apt-get install -y pigz > /dev/null
      - name: Signing key
        if: steps.check.outputs.build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - if: steps.check.outputs.build
        run: tools/release.sh dict
      - name: Publish
        if: steps.check.outputs.build
        env: { GH_TOKEN: "${{ github.token }}", DICT: "${{ steps.check.outputs.tag }}" }
        run: |
          gh release create "$DICT" dist/roma-dict-*.apk.gz --title "Japanese dictionary ${DICT#dict-}" \
            --notes "SudachiDict core ${DICT#dict-} as a companion app for roma, without what roma never reads (postal addresses, split and synonym data; duplicate cost rows merged). roma installs it when Japanese is romanized. SudachiDict is Apache-2.0 (Works Applications)."

  publish:
    needs: [app, dict, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: app, path: dist }
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Notes: the version's own commit ("0.1.28: …"), which may sit below later fixes on the tag.
          git log -1 --format=%B --grep "^${GITHUB_REF_NAME#v}:" "$GITHUB_REF_NAME" | grep -v '^Co-Authored-By' > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/roma-${GITHUB_REF_NAME#v}.apk --title "roma ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --latest
