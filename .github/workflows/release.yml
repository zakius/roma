# Every push to master builds and tests. When app/build.gradle.kts has a versionName with no release yet, the run also
# signs (tools/release.sh) and publishes it as a GitHub release, tagged v<version> on that commit: a merge that bumps the
# version is the release. The desktop app (:desktop) ships in the same release: a .deb and an .rpm built on Linux, an
# .msi on Windows, with roma-aac (tools/build-ffmpeg.sh) built for both on Linux. The dictionary app gets its own release, dict-<version>, the first time its version ships;
# roma downloads it from there. The app and the dictionary build in parallel jobs, and the core tests (which need the
# slim dictionary) in a third; roma's release is published only once its dictionary release exists and the tests pass.
# Only master: setup-gradle saves the Gradle cache (with SudachiDict and the slim dictionary) on the default branch
# alone, and a cache saved by a tag's run is visible to that tag only.
# Secrets: KEYSTORE_BASE64 (the .jks, base64), STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: release
on:
  push:
    branches: [master]
  # A pull request's build and packages before it merges; nothing is signed or published off master.
  pull_request:
permissions:
  contents: write
# The runner's git names its first branch "master" without asking; saying so quiets its hint in every checkout.
env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: master }
# Merges in quick succession release one at a time, so a version can't be published twice. A pull request's runs
# have a group of their own: in this one, a queued run would cancel master's waiting release run.
concurrency: { group: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}", cancel-in-progress: false }
# ubuntu-24.04, not ubuntu-latest: the image the release is built and tested on, changed on purpose rather than by GitHub.
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: New version?
        id: check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Only "release not found" is a new version; any other error (network, rate limit) fails the run. Only master
          # releases: a pull request's run only builds.
          if [ "$GITHUB_REF" != refs/heads/master ]; then echo "release=" >> "$GITHUB_OUTPUT"
          elif out=$(gh release view "v$v" 2>&1); then echo "release=" >> "$GITHUB_OUTPUT"
          elif [[ $out == *"release not found"* ]]; then echo "release=1" >> "$GITHUB_OUTPUT"
          else echo "$out" >&2; exit 1; fi

  app:
    needs: version
    runs-on: ubuntu-24.04
    env: { RELEASE: "${{ needs.version.outputs.release }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK and pigz
        run: |
          yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          sudo apt-get install -y pigz > /dev/null
      - name: Signing key
        if: env.RELEASE
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: tools/release.sh app
      - if: env.RELEASE
        uses: actions/upload-artifact@v7
        with: { name: app, path: dist/roma-*.apk }

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - run: tools/release.sh test

  # The desktop app's Linux packages: the ProGuard-shrunk app on the distribution's Java (tools/linux-packages.sh),
  # with roma-aac, which is built here for Windows too (tools/build-ffmpeg.sh cross-compiles it).
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get install -y rpm > /dev/null
      - run: ./gradlew -q :desktop:createReleaseDistributable :desktop:icuCheck
      - run: desktop/build/compose/binaries/main-release/app/roma/bin/roma --check
      - run: tools/linux-packages.sh --no-gradle
      - uses: actions/upload-artifact@v7
        with: { name: desktop-linux, path: "dist/roma*" }
      - uses: actions/upload-artifact@v7
        with: { name: roma-aac, path: ~/.gradle/caches/roma/roma-aac-*/windows/roma-aac.exe }
      # ProGuard renames the desktop classes; the release keeps the mapping that reads their stack traces (retrace).
      - uses: actions/upload-artifact@v7
        with: { name: desktop-mapping, path: desktop/build/proguard-mapping.txt }

  # Windows: the full .msi (its own Java) and the small .msi and .zip, which find Java 21+ or download it once
  # (tools/windows-small.sh). Each starts once with --check. Temurin 21, not 24+: those ship no jmods, which ProGuard
  # and jlink read.
  desktop-windows:
    needs: desktop-linux
    runs-on: windows-2025
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v8
        with: { name: roma-aac, path: aac/windows }
      - run: ./gradlew -q :desktop:packageReleaseMsi :desktop:createReleaseDistributable "-Proma.aacDir=$GITHUB_WORKSPACE/aac"
      - name: Check the full build
        shell: pwsh
        run: |
          $p = Start-Process desktop/build/compose/binaries/main-release/app/roma/roma.exe -ArgumentList --check -Wait -PassThru -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt, check-err.txt
          exit $p.ExitCode
      - run: tools/windows-small.sh
      - name: Check the small build
        shell: pwsh
        run: |
          $p = Start-Process desktop/build/windows-small/roma/roma.exe -ArgumentList --check -Wait -PassThru -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt, check-err.txt
          exit $p.ExitCode
      - run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp desktop/build/compose/binaries/main-release/msi/roma-*.msi "dist/roma-$v-x64-full.msi"
      - uses: actions/upload-artifact@v7
        with: { name: desktop-windows, path: "dist/roma*" }

  # Built only when its version has no release yet; otherwise this job ends after one API call.
  dict:
    needs: version
    runs-on: ubuntu-24.04
    env: { RELEASE: "${{ needs.version.outputs.release }}" }
    steps:
      - uses: actions/checkout@v5
      - name: Dictionary already released?
        id: check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(sed -n 's/^val dictRelease = "\(.*\)"/\1/p' core/build.gradle.kts)
          echo "tag=dict-$v" >> "$GITHUB_OUTPUT"
          if gh release view "dict-$v" > /dev/null 2>&1; then echo "build=" >> "$GITHUB_OUTPUT"; else echo "build=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.build
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - if: steps.check.outputs.build
        uses: gradle/actions/setup-gradle@v5
      - name: Android SDK and pigz
        if: steps.check.outputs.build
        run: |
          yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          sudo apt-get install -y pigz > /dev/null
      - name: Signing key
        if: steps.check.outputs.build && env.RELEASE
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - if: steps.check.outputs.build
        run: tools/release.sh dict
      - name: Publish
        if: steps.check.outputs.build && env.RELEASE
        env: { GH_TOKEN: "${{ github.token }}", DICT: "${{ steps.check.outputs.tag }}" }
        run: |
          gh release create "$DICT" dist/roma-dict-*.apk.gz --target "$GITHUB_SHA" --latest=false --title "Japanese dictionary ${DICT#dict-}" \
            --notes "SudachiDict core ${DICT#dict-} as a companion app for roma, without what roma never reads (postal addresses, split and synonym data; duplicate cost rows merged). roma installs it when Japanese is romanized. SudachiDict is Apache-2.0 (Works Applications)."

  publish:
    if: needs.version.outputs.release
    needs: [version, app, dict, test, desktop-linux, desktop-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: app, path: dist }
      - uses: actions/download-artifact@v8
        with: { pattern: "desktop-*", path: dist, merge-multiple: true }
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.version.outputs.version }}" }
        run: |
          # Notes: the version's own commit ("0.1.28: …"), which may sit below later fixes in this push.
          git log -1 --format=%B --grep "^$V:" "$GITHUB_SHA" | grep -v '^Co-Authored-By' > "$RUNNER_TEMP/notes.md"
          # javax.json ships in the APK under GPL 2 with the Classpath Exception, so its source goes with each release.
          json=dist/javax.json-1.1.4-sources.jar
          curl -sfL -o "$json" https://repo1.maven.org/maven2/org/glassfish/javax.json/1.1.4/javax.json-1.1.4-sources.jar
          echo "31d21d4721eb050616683bee90e3c7d126110dffdbf8bf4d3cc992891a60419b  $json" | sha256sum -c -
          # roma-aac, in the desktop packages, is ffmpeg (LGPL 2.1): its source goes with each release too.
          ffmpeg=$(sed -n 's/^FFMPEG=//p' tools/build-ffmpeg.sh)
          sha=$(sed -n 's/^FFMPEG_SHA=//p' tools/build-ffmpeg.sh)
          curl -sfL -o "dist/ffmpeg-$ffmpeg.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$ffmpeg.tar.xz"
          echo "$sha  dist/ffmpeg-$ffmpeg.tar.xz" | sha256sum -c -
          gh release create "v$V" dist/roma-$V.apk "$json" dist/roma_${V}_amd64.deb dist/roma-$V-1.x86_64.rpm dist/roma-$V-x64.msi \
            dist/roma-$V-x64-full.msi dist/roma-$V-windows-x64.zip dist/proguard-mapping.txt "dist/ffmpeg-$ffmpeg.tar.xz" --target "$GITHUB_SHA" --title "roma $V" --notes-file "$RUNNER_TEMP/notes.md" --latest
